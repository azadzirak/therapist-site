<section class="bg-gray-50 py-16 md:py-20">
    <div class="max-w-6xl mx-auto px-6">

        <!-- Section Header -->
        <div class="text-center mb-10 md:mb-12">
            <h2 class="text-3xl md:text-4xl font-bold text-gray-900">
                How I Can Help You
            </h2>

            <p class="mt-4 text-base md:text-lg text-gray-600 max-w-2xl mx-auto">
                Professional support designed around your needs.
            </p>
        </div>

        <!-- Services -->
        <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-6 md:gap-8">

            {% for service in services %}

                <div class="bg-white p-6 md:p-8 rounded-xl shadow-sm
                            hover:shadow-lg transition duration-300
                            border border-gray-100">

                    <div class="text-4xl mb-5">
                        {{ service.icon }}
                    </div>

                    <h3 class="text-xl font-bold text-gray-900 mb-3">
                        {{ service.title }}
                    </h3>

                    <p class="text-gray-600 leading-relaxed">
                        {{ service.description }}
                    </p>

                </div>

            {% empty %}

                <div class="sm:col-span-2 md:col-span-3 text-center py-8">
                    <p class="text-gray-500">
                        No services are currently available.
                    </p>
                </div>

            {% endfor %}

        </div>

    </div>
</section>
